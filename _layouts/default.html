<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon-face.svg' | relative_url }}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% feed_meta %}
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header><nav aria-label="Main navigation"><ul>
<li><a href="{{ '/' | relative_url }}">Oliver Fried</a></li>
</ul></nav></header>
<main id="content">
{% if page.collection == 'posts' %}
<article><h1>{{ page.title | escape }}</h1>
{{ content }}
<p><a href="{{ '/' | relative_url }}">← All essays</a></p></article>
{% else %}{{ content }}{% endif %}
</main>
<footer>
<p>Note: all text on this website is human-written. None of it is AI generated.</p>
<a href="https://github.com/oliver-fried">github</a> | <a href="{{ '/feed.xml' | relative_url }}">rss</a>
</footer>
</body>
</html>
